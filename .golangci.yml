version: "2"

run:
  timeout: 10m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - contextcheck
    - copyloopvar
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gocritic
    - gosec
    - govet
    - ineffassign
    - loggercheck
    - makezero
    - mirror
    - misspell
    - modernize
    - musttag
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - perfsprint
    - predeclared
    - promlinter
    - reassign
    - revive
    - sloglint
    - staticcheck
    - testifylint
    - thelper
    - tparallel
    - unparam
    - unused
    - unconvert
    - usestdlibvars
    - usetesting
    - whitespace
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    gocritic:
      enable-all: true
      disabled-checks:
      - hugeParam
      - rangeValCopy
      - unnamedResult
    govet:
      enable-all: true
      disable:
        - fieldalignment
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      enable-default-rules: true
      max-open-files: 2048
    sloglint:
      attr-only: true
      context: scope
      key-naming-case: snake
      msg-style: capitalized
      static-msg: true
      no-global: all
      forbidden-keys:
        - time
        - level
        - msg
        - source
    staticcheck:
      checks:
        - all
    testifylint:
      enable-all: true
  exclusions:
    rules:
      - linters:
          - unparam
        path: (.+)_test\.go
      - linters:
          - gosec
        path: ^internal/config/load\.go$
        text: G304
      - linters:
          - gosec
        path: ^deploy/kubernetes/manifests_test\.go$
        text: G304
      - linters:
          - gosec
        path: ^integration/envoy_test\.go$
        text: G204

formatters:
  enable:
    - gofumpt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
