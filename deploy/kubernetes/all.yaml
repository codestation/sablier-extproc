apiVersion: v1
kind: Namespace
metadata:
  name: sablier-extproc
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sablier-extproc
  namespace: sablier-extproc
data:
  config.yaml: |
    version: 1
    server:
      grpcListenAddress: ":18080"
      adminListenAddress: ":8080"
    sablier:
      baseURL: "http://sablier.sablier-system.svc.cluster.local:10000"
      requestTimeout: 3s
      maxResponseBytes: 1MiB
      sessionDuration: 1h
      failurePolicy: closed
      retryAfter: 5s
    logging:
      level: info
    mappings:
      - host: "app.example.com"
        pathPrefix: "/"
        group: "app"
        exclusions:
          - type: exact
            path: "/healthz"
          - type: pathPrefix
            path: "/metrics"
        waitingPage:
          displayName: "Application"
          theme: "hacker-terminal"
          showDetails: true
          refreshFrequency: 5s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sablier-extproc
  namespace: sablier-extproc
  labels:
    app.kubernetes.io/name: sablier-extproc
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sablier-extproc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sablier-extproc
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sablier-extproc
          image: ghcr.io/sablierapp/sablier-extproc:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - -config=/etc/sablier-extproc/config.yaml
          ports:
            - name: grpc
              containerPort: 18080
              protocol: TCP
            - name: admin
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /livez
              port: admin
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/sablier-extproc
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: sablier-extproc
---
apiVersion: v1
kind: Service
metadata:
  name: sablier-extproc
  namespace: sablier-extproc
  labels:
    app.kubernetes.io/name: sablier-extproc
spec:
  selector:
    app.kubernetes.io/name: sablier-extproc
  ports:
    - name: grpc
      port: 18080
      targetPort: grpc
      appProtocol: kubernetes.io/h2c
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-backend
  namespace: sablier-extproc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: app-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app-backend
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: registry.k8s.io/gateway-api/echo-basic:v1.5.1@sha256:1930f87f9a037f8acadc37e79185bb217614d9674304e3c1f6074aec8ff6b8dc
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: app-backend
  namespace: sablier-extproc
spec:
  selector:
    app.kubernetes.io/name: app-backend
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: app
  namespace: sablier-extproc
spec:
  gatewayClassName: kgateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayExtension
metadata:
  name: sablier-extproc
  namespace: sablier-extproc
spec:
  extProc:
    grpcService:
      backendRef:
        group: ""
        kind: Service
        name: sablier-extproc
        port: 18080
    failOpen: false
    messageTimeout: 5s
    allowProcessingModeOverride: false
    processingMode:
      requestHeaderMode: SEND
      responseHeaderMode: SKIP
      requestBodyMode: NONE
      responseBodyMode: NONE
      requestTrailerMode: SKIP
      responseTrailerMode: SKIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
  namespace: sablier-extproc
spec:
  parentRefs:
    - name: app
  hostnames:
    - app.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: app-backend
          port: 3000
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: sablier-extproc
  namespace: sablier-extproc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: app
  extProc:
    extensionRef:
      name: sablier-extproc
